name: Build Android APK

on:
  push:
    branches: [claude/flutter-ecommerce-app-DpTNL, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms android .

      - name: Configure Android manifest for url_launcher
        run: |
          cat >> android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          MANIFEST
          python3 - << 'PYEOF'
          import re

          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          queries_block = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>
          """

          # Insert before </manifest>
          content = content.replace('</manifest>', queries_block + '\n</manifest>')

          with open(path, 'w') as f:
              f.write(content)
          print("AndroidManifest.xml updated successfully")
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug — no keystore needed)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcreations-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "APK size: $SIZE"
          echo "APK built successfully at: $APK"
