name: Build Android APK

on:
  push:
    branches: [claude/flutter-ecommerce-app-DpTNL, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms android --project-name vcreations .

      - name: Configure Android manifest
        run: |
          python3 - << 'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          permissions = (
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"'
              ' android:maxSdkVersion="32"/>\n'
          )

          queries = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <data android:scheme="https" />\n'
              '        </intent>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <data android:scheme="whatsapp" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )

          content = content.replace('<application', permissions + '\n    <application', 1)
          content = content.replace('</manifest>', queries + '\n</manifest>')

          with open(path, 'w') as f:
              f.write(content)
          print("AndroidManifest.xml updated successfully")
          PYEOF

      - name: Fix app name
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          mkdir -p "$(dirname "$STRINGS")"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">vcreations</string>|<string name="app_name">V Créations</string>|' "$STRINGS"
          else
            cat > "$STRINGS" << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">V Créations</string>
</resources>
XML
          fi
          echo "strings.xml:"
          cat "$STRINGS"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons from logo
        run: dart run flutter_launcher_icons

      - name: Build APK (debug — no keystore needed)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcreations-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "APK size: $SIZE"
          echo "APK built successfully at: $APK"
